# CodeQL on every pull request and on main. An advanced setup in the
# organization's CI image: the default one builds with the runner's GCC 13,
# which cmake/CompilerFlags.cmake refuses for C23, and without the
# libraries the text component, the renderer and the glue need.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 8 * * 3"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The CI image, as cpp.yml runs it: --init gives the container a PID 1
    # that reaps orphans, so a server or browser a step stops (Xvfb,
    # Chrome's helpers) is gone rather than left a zombie.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        # The library with the text component, the AT-SPI adapter, the
        # reference renderer and the Maul Window glue, and the tests.
        run: |
          cmake --preset linux-gcc-14 -B out/codeql -DCMAKE_BUILD_TYPE=Debug -DMAUL_UI_RHI=ON \
            -DMAUL_UI_WINDOW=ON -DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF \
            -DMAUL_UI_BUILD_BENCH=OFF -DMAUL_UI_TEST_PACKAGE=OFF
          cmake --build out/codeql -j 4
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
