# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer and runs the iOS tests in the
# simulator. Each desktop build cell is a CMake preset built by the
# organization's shared workflow; the cells that need a simulator, an
# emulator or a browser, and the other jobs, are here, each through its
# preset too. docs/operations/checks.md explains each job, and
# tools/check.sh runs the Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_UI

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@6ce8dd114cb71948ce6a28dd7b122cb9f4514e0b # v0.0.38
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@6ce8dd114cb71948ce6a28dd7b122cb9f4514e0b # v0.0.38

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@6ce8dd114cb71948ce6a28dd7b122cb9f4514e0b # v0.0.38
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the text component's
  # header list, the litmus check on the API, test hygiene and labels, the
  # layout fixtures' tables, the documentation site, and clang-tidy over
  # the core's, the renderer's
  # and the glue's sources. It runs on documentation changes too, since the
  # snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The CI image, as cpp.yml runs it: --init gives the container a PID 1
    # that reaps orphans, so a server or browser a step stops (Xvfb,
    # Chrome's helpers) is gone rather than left a zombie.
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        # The renderer's shader containers and the layout fixtures' tables
        # are generated.
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files 'include/*.h' 'src/*.[chm]' 'test/*.[chm]' 'tools/*.[ch]' 'bench/*.[ch]' \
            'samples/*.[ch]' 'rhi/*.[ch]' 'window/*.[ch]' | grep -v -E '_container\.h$|^test/generated/' |
            xargs --no-run-if-empty clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/check_text_headers.py
          python3 tools/check_litmus.py
          python3 tools/check_float_env.py
      # Every test registration, in the two Linux cells the pull request
      # check runs: the core and text component's, and the renderer's,
      # glue's and samples'.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          cmake --preset linux-clang-20-asan >/dev/null
          cmake --preset linux-parts >/dev/null
          python3 tools/check_test_hygiene.py --ctest out/linux-clang-20-asan --ctest out/linux-parts
      - name: Layout fixture tables match the corpus
        run: python3 tools/gen_layout_fixtures.py --check
      - name: The shader container matches its stamped inputs
        run: |
          python3 tools/gen_rhi_shaders.py --check
          python3 tools/gen_rhi_shaders.py --self-test
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # The Linux build's sources with the renderer and the glue; the other
        # platforms' code is compiled with warnings as errors by its own cell.
        # Twice: in Release, where the assertions compile out, and in Debug,
        # with them live. Each hides paths from the analyzer the other shows.
        run: |
          for build in Release Debug; do
            cmake --preset linux-parts -B out/tidy-$build -DCMAKE_BUILD_TYPE=$build \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -D${PREFIX}_BUILD_TESTS=OFF \
              -D${PREFIX}_BUILD_SAMPLES=OFF -D${PREFIX}_SANITIZE=OFF
            cmake --build out/tidy-$build
            python3 tools/tidy_files.py out/tidy-$build/compile_commands.json >out/tidy-files.txt
            xargs -a out/tidy-files.txt -n 1 clang-tidy-20 -p out/tidy-$build --quiet \
              --warnings-as-errors='*'
          done

  # Every cell builds with warnings as errors and runs its whole suite, the
  # header tests included. The gcc-14 and shared cells also install the
  # library and build samples/minimal against it (the "package" test); the
  # parts cells build the reference renderer and the Maul Window glue, and
  # draw on lavapipe under the Vulkan validation layer.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-gcc-14, runner: ubuntu-24.04-arm }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-core }
          - { preset: linux-parts }
          - { preset: linux-parts-core }
          - { preset: linux-parts-gcc-14 }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@6ce8dd114cb71948ce6a28dd7b122cb9f4514e0b # v0.0.38
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # Each fuzz target runs over the bytes the library reads from fonts,
  # images and the AT-SPI bus, from tools/fuzz_seed.py's seeds and the
  # corpus the cache carries: briefly on a pull request, longer on main and
  # at night. The targets share one job, so their corpora share one cache
  # entry; docs/operations/checks.md says how it is kept.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 120 }}
      # A target's minimized corpus may not pass this, so one target's
      # growth cannot crowd the others out of the cache.
      CORPUS_LIMIT_MB: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -D${PREFIX}_FUZZ=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      # Caches are immutable: each clean run on main saves a new entry, and
      # every run restores the latest, a pull request's included, so a
      # change that breaks a harness's promise fails on its own pull
      # request. A pull request's run only reads the cache.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run
        # Four targets at a time, one per core of the runner; each keeps its
        # full time. The seeds join whatever corpus the cache brought, as
        # its floor. tools/fuzz_target.sh keeps each target's log and
        # findings on the runner and reports a finding without its input;
        # the reports print once every target has finished. Nothing is
        # uploaded.
        run: |
          python3 tools/fuzz_seed.py out/corpus
          targets=(out/fuzz/fuzz_*)
          [ -x "${targets[0]}" ] || { echo "::error::no fuzz target was built"; exit 1; }
          rm -rf out/fuzz-reports
          status=0
          printf '%s\n' "${targets[@]}" |
            xargs -P 4 -I {} sh -c 'corpus="out/corpus/corpus-$(basename "$1")" &&
              mkdir -p "$corpus" &&
              tools/fuzz_target.sh "$1" -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096 "$corpus"' _ {} ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      # Each corpus is merged into a fresh directory through
      # tools/fuzz_target.sh --merge, which reruns every input, keeps the
      # log on the runner and fails on a finding as a run does; it takes
      # the run's memory limit, so an input the run kept is not refused
      # here as out of memory. The merged corpora are swapped in only when
      # every merge passed, so a failed merge leaves the old ones, and the
      # save is skipped. This step and the save run only on main and only
      # when every target found nothing: a run that found something keeps
      # its corpus, which holds inputs near the finding, out of the cache.
      - name: Minimize the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf out/merged out/fuzz-reports
          status=0
          targets=(out/fuzz/fuzz_*)
          printf '%s\n' "${targets[@]##*/}" |
            xargs -P 4 -I {} \
              tools/fuzz_target.sh --merge out/fuzz/{} out/merged/corpus-{} out/corpus/corpus-{} \
                -rss_limit_mb=4096 ||
            status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          [ "$status" -eq 0 ] || exit "$status"
          for d in out/merged/*/; do
            name=$(basename "$d")
            rm -rf "out/corpus/$name" && mv "$d" "out/corpus/$name"
          done
          over=0
          {
            echo "| Target | Inputs | MB |"
            echo "|---|---|---|"
            for d in out/corpus/*/; do
              name=$(basename "$d")
              # The bytes the cache holds, not the disk blocks they take.
              mb=$(du -sm --apparent-size "$d" | cut -f1)
              echo "| ${name#corpus-} | $(find "$d" -type f | wc -l) | $mb |"
              if [ "$mb" -gt "$CORPUS_LIMIT_MB" ]; then
                echo "::error::${name#corpus-}: corpus of $mb MB passes $CORPUS_LIMIT_MB MB" >&2
                over=1
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$over"
      - name: Save the corpus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # The samples presented on an X11 window's surface under Xvfb, through
  # Maul Window's X11 backend, on lavapipe under the validation layer: each
  # sample's last frame read back and checked.
  samples-x11:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      MUI_RHI_REQUIRED: 1
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-parts-core -B out/x11 -D${PREFIX}_TEXT=ON -DMAUL_WINDOW_X11=ON \
            -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/x11
      - name: The samples in a window
        run: |
          samples=(out/x11/sample_*)
          [ -x "${samples[0]}" ] || { echo "::error::no sample was built"; exit 1; }
          for sample in "${samples[@]}"; do
            # -noreset: a server that resets when its last client leaves
            # refuses a connection that arrives during the reset.
            xvfb-run -a -s "-screen 0 1024x768x24 -noreset" "$sample" --frames 5 2>&1 | tee out/window.log
            grep -q "the presented frame checked" out/window.log
            ! grep -qiE "validation error|VUID" out/window.log
          done

  # The iOS adapter and the glue: built with their tests on every pull
  # request, the only cell that compiles them, and run in the simulator on
  # main and every night. A simulator's boot and first launch take minutes
  # on the macOS runners, more than the pull request check's budget leaves.
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset ios-simulator
          cmake --build --preset ios-simulator -j 4
      - name: Boot a simulator
        if: github.event_name != 'pull_request'
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # A new device's first launch takes minutes: paid here, not by a test.
          xcrun simctl launch "$udid" com.apple.Preferences
          xcrun simctl terminate "$udid" com.apple.Preferences
      - name: Test
        if: github.event_name != 'pull_request'
        run: |
          ctest --preset ios-simulator --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-simulator
          path: out/ios-simulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # Every test in the Android emulator, Android 11 on x86_64 with KVM,
  # through adb, the accessibility adapter's as an application. The runner
  # carries the SDK and the NDK; the emulator and its system image come from
  # the SDK manager.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      # Where avdmanager writes the device and the emulator reads it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed
          # when the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul30 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake --preset android-emulator
          cmake --build --preset android-emulator -j 4
      - name: Test
        run: |
          ctest --preset android-emulator --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The web without Emscripten: Clang's wasm32-wasi, every test under Node's
  # WASI and the ARIA test in headless Chrome through puppeteer. The text
  # component is left out: FreeType needs setjmp, which wasi-libc lacks.
  web-wasi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset web-wasi
          cmake --build --preset web-wasi -j 4
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
      - name: Test
        run: |
          MUI_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" ctest --preset web-wasi --no-tests=error |
            tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-wasi
          path: out/web-wasi/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The library, the renderer and the glue built by Emscripten: the tests
  # under Node, the ARIA adapter, the renderer's pixels and the samples in
  # headless Chrome's WebGPU (SwiftShader). The CI image has no Emscripten,
  # so this job uses the runner and the emsdk action, and hands the samples
  # to web-canvas.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
          echo "MUI_NODE_MODULES=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
      - name: Test
        env:
          MUI_RHI_REQUIRED: 1
        run: |
          ctest --preset web-emscripten --no-tests=error | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: The renderer's WGSL in headless Chrome's WebGPU
        # The shader tools pass WGSL through untouched.
        run: node tools/check_wgsl.cjs rhi/shaders/quad.wgsl
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Samples for web-canvas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-samples
          path: |
            out/web-emscripten/sample_*.js
            out/web-emscripten/sample_*.wasm
          if-no-files-found: error
          retention-days: 1

  # Each sample built by web-emscripten presenting into a canvas from the
  # browser's frames, its last frame read back and checked. Chrome's
  # compositor needs Vulkan, which the CI image has as lavapipe and the
  # runner has not.
  web-canvas:
    needs: web-emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      MUI_RHI_REQUIRED: 1
      MUI_WEB_CANVAS: 1
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-samples
          path: out/web-samples
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
          echo "MUI_NODE_MODULES=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
      - name: The samples in a canvas
        run: |
          samples=(out/web-samples/sample_*.js)
          [ -f "${samples[0]}" ] || { echo "::error::no sample was handed over"; exit 1; }
          for sample in "${samples[@]}"; do
            node test/web_runner.cjs "$sample" --frames 5 | tee "$RUNNER_TEMP/canvas.log"
            grep -q "the presented frame checked" "$RUNNER_TEMP/canvas.log"
          done

  # The wasm each part adds to a program at -Oz with link-time optimization,
  # against its ceiling (tools/size_report.py): over a ceiling fails. The
  # Emscripten version is pinned, so the sizes move only with our code or
  # with a pull request that moves the pin.
  size:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.13
          # emsdk's own scripts at the commit of its 6.0.13 tag; left
          # unset, they would come from that tag, which can move.
          emsdk-version: 35659964bc2762fffec0d257997fb61475f765b7 # 6.0.13
      - name: Build
        run: |
          emcmake cmake -B out/size -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS_MINSIZEREL="-Oz -DNDEBUG" -DCMAKE_CXX_FLAGS_MINSIZEREL="-Oz -DNDEBUG" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/size -j 4
      - name: Size against the ceilings
        run: python3 tools/size_report.py out/size --check

  # The quarantined tests (docs/operations/checks.md#quarantine), which the
  # test presets leave out, under AddressSanitizer and UBSan: at night and
  # on a manual run. A known flake's failure is a warning; a test that did
  # not run, a sanitizer report or a crash fails the job.
  quarantine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset linux-clang-20-asan
          cmake --build --preset linux-clang-20-asan
      - name: The quarantined tests
        # By build directory, not the preset; the preset sets nothing
        # beyond its 300 seconds a test, which the script gives too.
        run: tools/run_quarantine.sh out/linux-clang-20-asan

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs:
      - changes
      - docs
      - zizmor
      - checks
      - build
      - msvc-headers
      - fuzz
      - samples-x11
      - ios-simulator
      - android-emulator
      - web-wasi
      - web-emscripten
      - web-canvas
      - size
      - quarantine
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
