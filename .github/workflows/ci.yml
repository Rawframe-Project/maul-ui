# Continuous integration for Maul UI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_UI
  # A mirror that stalls mid-download is given up on and tried again,
  # rather than waited on until the step's limit.
  APT_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # A package mirror that hangs fails the step, to be run again,
        # rather than holding a runner for the job's six hours.
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          # The renderer's cooked shader containers are generated.
          clang-format --dry-run -Werror $(find include src test tools bench samples rhi window \
            -name '*.[ch]' -not -name '*_container.h' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_text_headers.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
          python3 tools/gen_layout_fixtures.py --check
      - name: API reference
        # docs/api.md is what the generator makes from the headers, and
        # the README gives its function count.
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }
      - name: No engine concept in the API
        # The litmus test of record mui-0001: any engine or application
        # can drive Maul UI over its own tree.
        run: python3 tools/check_litmus.py
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # The sources of the Linux build; Windows code is checked by its cell.
          for f in $(python3 -c "import json; print('\n'.join(sorted({e['file'] for e in json.load(open('build/compile_commands.json')) if '/src/' in e['file'] and '_deps' not in e['file']})))"); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_UI_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_UI_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_UI_BUILD_SHARED=ON" }
          # The core alone, without the text component (record mui-0006).
          - { name: linux-core,          os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_UI_TEXT=OFF" }
          - { name: linux-arm64-gcc-14,  os: ubuntu-24.04-arm, cc: gcc-14, cxx: g++-14,   config: Release, extra: "" }
          # With the Maul Window glue, its NSAccessibility branch built.
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "-DMAUL_UI_WINDOW=ON" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # clang without its recommends, which pull llvm-20-dev, the
          # download that stalled; the sanitizers' runtime by name.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q gcc-14 g++-14 ninja-build
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 240
      # The installed package, shared and static, used as a program uses
      # it: samples/minimal built by CMake and by pkg-config, and run.
      - name: Package
        if: matrix.name == 'linux-shared' || matrix.name == 'linux-gcc-14'
        run: |
          cmake --install build --prefix "$PWD/package"
          cmake -S samples/minimal -B build-minimal -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_PREFIX_PATH="$PWD/package"
          cmake --build build-minimal
          LD_LIBRARY_PATH="$PWD/package/lib" ./build-minimal/minimal
          static=$([ "${{ matrix.name }}" = linux-gcc-14 ] && echo --static || true)
          export PKG_CONFIG_PATH="$PWD/package/lib/pkgconfig"
          ${{ matrix.cc }} -std=c17 samples/minimal/main.c -o minimal-pc \
            $(pkg-config $static --cflags --libs maul-ui)
          LD_LIBRARY_PATH="$PWD/package/lib" ./minimal-pc

  # Each fuzz target runs for one minute on every push, over the bytes
  # the text component reads from fonts, from tools/fuzz_seed.py's seeds.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          # libFuzzer's runtime, which clang only recommends.
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -D${PREFIX}_FUZZ=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_BUILD_BENCH=OFF \
            -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          python3 tools/fuzz_seed.py
          for target in build/fuzz_*; do
            "$target" -max_total_time=60 -rss_limit_mb=4096 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # With the Maul Window glue, its UI Automation branch built.
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON -D${PREFIX}_WINDOW=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 240
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  rhi:
    # The reference renderer (record mui-0005) with Maul RHI
    # fetched: clang-tidy over its sources, its test on Maul RHI's test
    # driver, and its pixels and the samples on lavapipe, which must be
    # found, under the Vulkan validation layer, whose errors fail the
    # step. The samples need the Maul Window glue, fetched with its
    # platform backends off.
    name: linux-rhi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler, lavapipe and the validation layer
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20 \
            libclang-rt-20-dev
          sudo apt-get $APT_OPTIONS install -y -q ninja-build mesa-vulkan-drivers vulkan-validationlayers
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${PREFIX}_WERROR=ON
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -D${PREFIX}_RHI=ON
          -D${PREFIX}_WINDOW=ON -DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: clang-tidy
        run: |
          for f in rhi/src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done
      - name: Test
        env:
          MUI_RHI_REQUIRED: 1
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          ctest --test-dir build -R "rhi|sample" --output-on-failure --timeout 240 | tee rhi.log
          ! grep -qiE "validation error|VUID" rhi.log
          build/test_rhi_pixels 2>&1 | tee pixels.log
          ! grep -qiE "validation error|VUID" pixels.log
      - name: The renderer and the samples under the sanitizers
        # AddressSanitizer and UBSan, aborting on any report, over the
        # renderer's tests and the samples headless on lavapipe.
        env:
          MUI_RHI_REQUIRED: 1
        run: |
          cmake -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${PREFIX}_WERROR=ON \
            -D${PREFIX}_SANITIZE=ON -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -D${PREFIX}_RHI=ON -D${PREFIX}_WINDOW=ON -DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF
          cmake --build build-sanitize -j 4
          ctest --test-dir build-sanitize -R "rhi|sample" --output-on-failure --timeout 240
      - name: Without Maul UI's text component
        # Glyph runs need the text component's atlas; the renderer
        # refuses a text service without it and draws all else.
        env:
          MUI_RHI_REQUIRED: 1
        run: |
          cmake -B build-notext -G Ninja -D${PREFIX}_WERROR=ON -D${PREFIX}_TEXT=OFF -D${PREFIX}_RHI=ON \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          cmake --build build-notext -j 4
          ctest --test-dir build-notext -R rhi --output-on-failure --timeout 240
      - name: The samples in a window
        # Each sample presented on an X11 window's surface under Xvfb
        # through Maul Window's X11 backend, its last frame read back
        # and checked, under the validation layer.
        env:
          MUI_RHI_REQUIRED: 1
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          sudo apt-get $APT_OPTIONS install -y -q xvfb libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-render0-dev libxcb-xinput-dev libxkbcommon-x11-dev
          cmake -B build-x11 -G Ninja -D${PREFIX}_WERROR=ON -D${PREFIX}_RHI=ON \
            -D${PREFIX}_WINDOW=ON -D${PREFIX}_BUILD_TESTS=OFF -DMAUL_WINDOW_WAYLAND=OFF \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          cmake --build build-x11 -j 4
          for sample in build-x11/sample_*; do
            xvfb-run -a -s "-screen 0 1024x768x24" "$sample" --frames 5 2>&1 | tee window.log
            test "${PIPESTATUS[0]}" -eq 0
            grep -q "the presented frame checked" window.log
            ! grep -qiE "validation error|VUID" window.log
          done

  window:
    # The Maul Window glue (record mui-0007) with Maul Window fetched at
    # its release tag: clang-tidy over its sources, and its tests on Maul
    # Window's headless test backend, the platform backends off; then
    # again without the text component, which its compositions need.
    name: linux-window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the compiler
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get $APT_OPTIONS install -y -q ninja-build
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${PREFIX}_WERROR=ON
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -D${PREFIX}_WINDOW=ON -DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: clang-tidy
        run: |
          for f in window/src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done
      - name: Test
        run: ctest --test-dir build -R window --output-on-failure --timeout 240
      - name: Without Maul UI's text component
        run: |
          cmake -B build-notext -G Ninja -D${PREFIX}_WERROR=ON -D${PREFIX}_TEXT=OFF \
            -D${PREFIX}_WINDOW=ON -DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          cmake --build build-notext -j 4
          ctest --test-dir build-notext -R window --output-on-failure --timeout 240

  ios:
    # Every test in the iOS simulator, through simctl spawn, on an iPhone
    # of the newest runtime, as Maul Window's cell (record mui-0008).
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The first application launch after a boot can take minutes;
          # one of the system's, here, keeps that out of the tests.
          start=$(date +%s)
          xcrun simctl launch "$udid" com.apple.Preferences
          xcrun simctl terminate "$udid" com.apple.Preferences
          echo "a first launch took $(($(date +%s) - start)) s"
          echo "MUI_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/ios-simulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON -D${PREFIX}_WINDOW=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 240

  android:
    # Every test in the Android emulator, Android 11 on x86_64 with KVM,
    # through adb, as Maul Window's cell (record mui-0008). The runner
    # carries the SDK and NDK r28; the emulator and its image are
    # installed here.
    name: android-emulator
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      # Where avdmanager writes the device and the emulator reads it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v7
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed when
          # the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul30 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/android-emulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON -D${PREFIX}_WINDOW=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 240

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    env:
      # Chrome's compositor on Vulkan through lavapipe, for canvases.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Install lavapipe
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTIONS update -q
          sudo apt-get $APT_OPTIONS install -y -q mesa-vulkan-drivers
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON -D${PREFIX}_WINDOW=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: |
          for t in build/test_*.js; do node "$t" || exit 1; done
      - name: Install Puppeteer and its headless Chrome
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test in headless Chrome
        # The ARIA adapter against the browser's accessibility tree; a
        # skip (77) fails the step, so green means it ran.
        run: MUI_NODE_MODULES=/tmp/browser/node_modules node test/web_runner.cjs build/test_aria.js
      - name: The samples in headless Chrome's WebGPU
        # The reference renderer drawing on WebGPU (SwiftShader), each
        # sample checking its pixels headless, then presenting into a
        # canvas from the browser's frames, its last frame read back and
        # checked, in a build of its own (record mui-0005).
        run: |
          emcmake cmake -B build-sample -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON \
            -D${PREFIX}_RHI=ON -D${PREFIX}_WINDOW=ON
          cmake --build build-sample -j 4
          for sample in build-sample/sample_*.js; do
            MUI_RHI_REQUIRED=1 MUI_NODE_MODULES=/tmp/browser/node_modules \
              node test/web_runner.cjs "$sample" --headless || exit 1
            MUI_WEB_CANVAS=1 MUI_RHI_REQUIRED=1 MUI_NODE_MODULES=/tmp/browser/node_modules \
              node test/web_runner.cjs "$sample" --frames 5 | tee canvas.log
            test "${PIPESTATUS[0]}" -eq 0
            grep -q "the presented frame checked" canvas.log
          done
      - name: The reference renderer's pixels in headless Chrome's WebGPU
        # test_rhi_pixels on WGSL, as it runs on SPIR-V natively.
        run: >
          MUI_RHI_REQUIRED=1 MUI_NODE_MODULES=/tmp/browser/node_modules
          node test/web_runner.cjs build-sample/test_rhi_pixels.js
      - name: The reference renderer's WGSL in headless Chrome's WebGPU
        # The shader tools pass WGSL through untouched (record mui-0005).
        run: MUI_NODE_MODULES=/tmp/browser/node_modules node tools/check_wgsl.cjs rhi/shaders/quad.wgsl
      - name: Size
        # The static library's size, reported, not gated (family record
        # 0013).
        run: stat -c '%s bytes' build/libmaul-ui.a
      - name: Wasm size against the budget
        # Each part's wasm at -Oz with link-time optimization, as record
        # mui-0001's size budget measures it; reported, checked at release.
        run: |
          emcmake cmake -B build-size -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS_MINSIZEREL="-Oz -DNDEBUG" -DCMAKE_CXX_FLAGS_MINSIZEREL="-Oz -DNDEBUG" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build build-size -j 4
          python3 tools/size_report.py build-size
