# Screen readers walking the samples (record mui-0008, research 148):
# VoiceOver on a macOS runner and NVDA on a Windows runner, set up and
# driven by Guidepup, as tools/screen_reader_walk.sh walks them with
# Orca, each walk checking the phrases its steps file expects. A
# workflow of its own: the readers' timing on the runners' virtual GPUs
# makes a walk miss a phrase now and then, so each walk is tried three
# times, every try kept as an artifact; a reader that cannot read the
# tree misses on every try.
name: screen-readers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  walk:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: voiceover, os: macos-15, configure: "-G Ninja", bin: build }
          - { name: nvda, os: windows-2025, configure: "-T ClangCL", bin: build/Release }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build the samples
        run: |
          cmake -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DMAUL_UI_RHI=ON \
            -DMAUL_UI_WINDOW=ON -DMAUL_UI_BUILD_TESTS=OFF
          cmake --build build --config Release -j 4 --target sample_controls sample_text
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # macOS's setup has failed now and then turning on Do Not Disturb,
      # passing on the next try. On some machines it never passes, macOS
      # refusing the runner's Apple events to System Events: VoiceOver is
      # then not run there, said by a warning, and the walk skipped
      # (research 148, I135); any other failure fails.
      - name: Set up the screen reader
        id: setup
        run: |
          mkdir -p "$RUNNER_TEMP/walk" && cd "$RUNNER_TEMP/walk"
          cp "$GITHUB_WORKSPACE/tools/screen_reader/walk.mjs" .
          npm init -y >/dev/null
          npm install --no-audit --no-fund @guidepup/guidepup@0.35.0 @guidepup/setup@0.29.1
          for try in 1 2 3; do
            npx @guidepup/setup setup --ci 2>&1 | tee setup.log && break
            if [ "$try" -eq 3 ]; then
              if grep -qE "Not authorized to send Apple events|not allowed to send keystrokes" setup.log; then
                echo "::warning::${{ matrix.name }} not run: this machine refused Guidepup's setup"
                echo "ran=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit 1
            fi
            sleep 10
          done
          npx @guidepup/setup install ${{ matrix.name }}
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Walk the samples
        if: steps.setup.outputs.ran == 'true'
        run: |
          status=0
          for sample in controls text; do
            for try in 1 2 3; do
              node "$RUNNER_TEMP/walk/walk.mjs" "$PWD/${{ matrix.bin }}/sample_$sample" \
                "tools/screen_reader/$sample.steps" "walk-$sample-$try" && break
              [ "$try" -lt 3 ] || status=1
            done
          done
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: walk-${{ matrix.name }}
          path: walk-*
