# Screen readers walking the samples every night: VoiceOver on a macOS
# runner and NVDA on a Windows runner, set up and driven by Guidepup as
# tools/screen_reader_walk.sh walks them with Orca, and NVDA over the ARIA
# adapter in Chrome; each walk checks the phrases its steps file expects.
# The readers' timing on the runners' virtual GPUs makes a walk miss a
# phrase now and then, so the walks stay out of the required check and are
# never retried; issue #4 tracks every failure until they pass reliably.
name: screen-readers

on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  walk:
    name: ${{ matrix.reader }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reader: voiceover, runner: macos-15, configure: "", bin: out/walk }
          - { reader: nvda, runner: windows-2025, configure: "-T ClangCL", bin: out/walk/Release }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the samples
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          cmake -B out/walk $CONFIGURE -DCMAKE_BUILD_TYPE=Release -DMAUL_UI_RHI=ON \
            -DMAUL_UI_WINDOW=ON -DMAUL_UI_BUILD_TESTS=OFF
          cmake --build out/walk --config Release -j 4 --target sample_controls sample_text
      - name: Set up the screen reader
        env:
          READER: ${{ matrix.reader }}
        # Guidepup as tools/screen_reader's lockfile pins it.
        run: |
          npm ci --prefix tools/screen_reader --no-audit --no-fund
          cd tools/screen_reader
          npx @guidepup/setup setup --ci
          npx @guidepup/setup install "$READER"
      - name: Walk the samples
        env:
          BIN: ${{ matrix.bin }}
        run: |
          for sample in controls text; do
            node tools/screen_reader/walk.mjs "$PWD/$BIN/sample_$sample" \
              "tools/screen_reader/$sample.steps" "walk-$sample"
          done
      - name: Walk logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-${{ matrix.reader }}
          path: walk-*
          if-no-files-found: ignore
          retention-days: 14

  # NVDA over the ARIA adapter: the controls and text samples built for the
  # web, in a Chrome with a window drawing WebGPU on SwiftShader, walked from
  # steps of their own, which first enable the page's accessibility tree as a
  # screen reader user does.
  nvda-chrome:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build the samples for the web
        run: |
          emcmake cmake -B out/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAUL_UI_RHI=ON \
            -DMAUL_UI_WINDOW=ON -DMAUL_UI_BUILD_TESTS=OFF
          cmake --build out/web -j 4 --target sample_controls sample_text
      - name: Set up the screen reader and the browser
        # Guidepup and puppeteer as tools/screen_reader's lockfile pins them.
        run: |
          npm ci --prefix tools/screen_reader --no-audit --no-fund
          cd tools/screen_reader
          npx @guidepup/setup setup --ci
          npx @guidepup/setup install nvda
          # NVDA reads a caret move only if the caret moves within 100 ms of
          # the key; the sample draws on SwiftShader, where a frame has taken
          # seconds, so the walk gives it NVDA's longest, 2000.
          ini=$(ls "$(cygpath -u "$LOCALAPPDATA")"/guidepup/nvda/all/*/extracted/userConfig/nvda.ini)
          if grep -q '^\[editableText\]' "$ini"; then
            sed -i 's/^\[editableText\]\r\?$/[editableText]\ncaretMoveTimeoutMs = 2000/' "$ini"
          else
            printf '\n[editableText]\ncaretMoveTimeoutMs = 2000\n' >> "$ini"
          fi
          grep -A1 '^\[editableText\]' "$ini"
      - name: Walk the samples in Chrome
        run: |
          for sample in controls text; do
            node tools/screen_reader/walk.mjs "$PWD/out/web/sample_$sample.js" \
              "tools/screen_reader/$sample-web.steps" "walk-web-$sample"
          done
      - name: Walk logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-nvda-chrome
          path: walk-*
          if-no-files-found: ignore
          retention-days: 14
